[project]
name = "cs2pipe"
version = "0.1.0"
description = "Demo-based CS2 breakdown shorts pipeline"
requires-python = ">=3.11"
dependencies = [
    "demoparser2>=0.42",
    "anthropic>=2.14",
    "flask>=3.0",
    "pillow>=10.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.100", "google-auth>=2.20"]
dev = ["pytest>=8"]

[project.scripts]
cs2pipe = "cs2pipe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cs2pipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
